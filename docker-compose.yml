# 개발용: DB 만 띄운다. 앱·리버스 프록시는 배포 단계에서 추가.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: publicdata
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # over TCP: during first-run init the server listens on the socket only, so a socket check would
      # report healthy before db/init/*.sql and 02_roles.sh have finished
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d publicdata"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  dbdata:
